<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATCG 序列共同子串查找工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e6edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 48px;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0b2b3f;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 16px;
            font-weight: 400;
            color: #4a6a7f;
            margin-left: 8px;
        }

        .subtitle {
            color: #4a6a7f;
            font-size: 15px;
            margin-bottom: 28px;
            border-left: 4px solid #2b7a9e;
            padding-left: 16px;
            background: rgba(43, 122, 158, 0.06);
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 30px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 14px;
            color: #1d4a63;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-group label .badge {
            background: #1d4a63;
            color: #fff;
            font-size: 11px;
            padding: 0 10px;
            border-radius: 20px;
            line-height: 20px;
            font-weight: 500;
        }
        .input-group label .badge.blue {
            background: #256fa0;
        }

        .input-group input {
            padding: 12px 16px;
            border: 2px solid #d6e2ed;
            border-radius: 14px;
            font-size: 18px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            letter-spacing: 2px;
            transition: all 0.2s;
            background: #ffffff;
            color: #0b2b3f;
            outline: none;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #2b7a9e;
            box-shadow: 0 0 0 4px rgba(43, 122, 158, 0.15);
        }
        .input-group input::placeholder {
            color: #b0c8da;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .input-group .hint {
            font-size: 12px;
            color: #7a96ae;
            margin-top: 2px;
        }

        .options-row {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            padding: 14px 0 10px 0;
            border-top: 1px solid #e2ecf5;
            margin-bottom: 18px;
        }

        .options-row .label {
            font-weight: 600;
            font-size: 14px;
            color: #1d4a63;
        }

        .options-row .radio-group {
            display: flex;
            gap: 18px;
        }

        .options-row .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #1d3a4f;
            cursor: pointer;
            padding: 4px 12px 4px 8px;
            border-radius: 30px;
            transition: background 0.15s;
        }
        .options-row .radio-group label:hover {
            background: rgba(43, 122, 158, 0.08);
        }
        .options-row .radio-group input[type="radio"] {
            accent-color: #2b7a9e;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1d6a8f, #2b7a9e);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 20px -6px rgba(43, 122, 158, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -8px rgba(43, 122, 158, 0.45);
            background: linear-gradient(135deg, #1a5f82, #256fa0);
        }
        .btn-primary:active {
            transform: translateY(0px);
            box-shadow: 0 4px 12px -4px rgba(43, 122, 158, 0.3);
        }

        .result-area {
            margin-top: 30px;
            border-top: 2px dashed #d6e2ed;
            padding-top: 28px;
        }

        .result-placeholder {
            text-align: center;
            color: #8aacbf;
            font-size: 15px;
            padding: 30px 10px;
            background: rgba(214, 226, 237, 0.25);
            border-radius: 18px;
            border: 1px dashed #c6d8e8;
        }

        .result-content {
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .seq-display {
            margin-bottom: 20px;
            background: #f8fbfe;
            border-radius: 18px;
            padding: 18px 20px;
            border: 1px solid #e2ecf5;
            transition: background 0.2s;
        }
        .seq-display:hover {
            background: #f4f9ff;
        }

        .seq-display .seq-label {
            font-weight: 600;
            font-size: 13px;
            color: #3a6a82;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .seq-display .seq-label .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 2px;
        }
        .seq-display .seq-label .dot.red {
            background: #d0314e;
        }
        .seq-display .seq-label .dot.blue {
            background: #1f7ab0;
        }
        .seq-display .seq-label .tag {
            font-size: 11px;
            background: #d6e2ed;
            color: #1d4a63;
            padding: 0 12px;
            border-radius: 30px;
            line-height: 20px;
            font-weight: 500;
        }

        .seq-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.5px;
            line-height: 1.6;
            padding: 4px 0;
        }

        .seq-chars .char {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 6px;
            transition: all 0.15s;
            min-width: 28px;
            text-align: center;
            background: transparent;
            color: #0b2b3f;
        }

        .seq-chars .char.mark-red {
            background: #d0314e;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(208, 49, 78, 0.25);
            border-radius: 6px;
            font-weight: 600;
        }

        .seq-chars .char.mark-blue {
            background: #1f7ab0;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(31, 122, 176, 0.25);
            border-radius: 6px;
            font-weight: 600;
        }

        .seq-chars .char.mark-red-weak {
            background: #fce8ec;
            color: #a8233e;
            border-radius: 6px;
        }
        .seq-chars .char.mark-blue-weak {
            background: #e4f0fa;
            color: #0f5a83;
            border-radius: 6px;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 32px;
            margin-top: 18px;
            padding: 16px 20px;
            background: #ecf3fa;
            border-radius: 16px;
            border: 1px solid #d6e2ed;
        }

        .stats .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 14px;
            color: #1d4a63;
        }
        .stats .stat-item .num {
            font-weight: 700;
            font-size: 20px;
            color: #0b2b3f;
        }
        .stats .stat-item .num.red {
            color: #d0314e;
        }
        .stats .stat-item .num.blue {
            color: #1f7ab0;
        }

        .lcs-info {
            margin-top: 14px;
            padding: 14px 20px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #d6e2ed;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 24px;
        }
        .lcs-info .lcs-label {
            font-weight: 600;
            color: #1d4a63;
            font-size: 14px;
        }
        .lcs-info .lcs-seq {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
            color: #0b2b3f;
            background: #f0f6fd;
            padding: 2px 16px;
            border-radius: 30px;
            letter-spacing: 2px;
        }
        .lcs-info .lcs-len {
            background: #2b7a9e;
            color: #fff;
            padding: 0 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            line-height: 28px;
        }
        .lcs-info .lcs-count {
            color: #4a6a7f;
            font-size: 14px;
        }

        .error-msg {
            color: #c0392b;
            background: #fde8e6;
            border: 1px solid #f5c6c2;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #7a96ae;
            text-align: center;
            border-top: 1px solid #e2ecf5;
            padding-top: 18px;
        }

        @media (max-width: 700px) {
            .container {
                padding: 24px 18px;
            }
            .input-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            h1 {
                font-size: 22px;
                flex-wrap: wrap;
            }
            .seq-chars {
                font-size: 18px;
            }
            .seq-chars .char {
                min-width: 22px;
                padding: 1px 2px;
            }
            .stats {
                flex-direction: column;
                gap: 8px;
            }
            .options-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .btn-primary {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .seq-chars {
                font-size: 15px;
                gap: 1px;
            }
            .seq-chars .char {
                min-width: 18px;
                padding: 1px 2px;
            }
            .lcs-info .lcs-seq {
                font-size: 16px;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            🧬 ATCG 共同子串
            <small>反转 · 匹配 · 标记</small>
        </h1>
        <div class="subtitle">
            输入两条 ATCG 序列，将 <strong>第一条反转</strong> 后与第二条查找所有公共子串（长度 ≥ 2），
            并用 <span style="color:#d0314e;font-weight:600;">红色</span> /
            <span style="color:#1f7ab0;font-weight:600;">蓝色</span> 标记相同（或互补）部分。
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label>
                    序列 1
                    <span class="badge">反转后标记红色</span>
                </label>
                <input type="text" id="seq1" placeholder="如: ATCGATCG" value="ATCGATCG" spellcheck="false">
                <div class="hint">只允许 A, T, C, G（不区分大小写）</div>
            </div>
            <div class="input-group">
                <label>
                    序列 2
                    <span class="badge blue">标记蓝色</span>
                </label>
                <input type="text" id="seq2" placeholder="如: GCTAGCTA" value="GCTAGCTA" spellcheck="false">
                <div class="hint">只允许 A, T, C, G（不区分大小写）</div>
            </div>
        </div>

        <div class="options-row">
            <span class="label">匹配模式：</span>
            <div class="radio-group">
                <label>
                    <input type="radio" name="mode" value="same" checked>
                    🔵 完全相同
                </label>
                <label>
                    <input type="radio" name="mode" value="complement">
                    🧬 互补配对 (A↔T, C↔G)
                </label>
            </div>
        </div>

        <button class="btn-primary" id="searchBtn">
            <span>🔍</span> 查找并标记
        </button>

        <div id="errorMsg" class="error-msg"></div>

        <div class="result-area" id="resultArea">
            <div class="result-placeholder" id="placeholder">
                ⬆️ 输入序列后点击「查找并标记」查看结果
            </div>
            <div class="result-content" id="resultContent" style="display:none;">
                <!-- 动态生成 -->
            </div>
        </div>

        <div class="footer-note">
            💡 公共子串长度 ≥ 2 才会被标记 · 反转后的序列 1 用红色，序列 2 用蓝色
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const seq1Input = document.getElementById('seq1');
            const seq2Input = document.getElementById('seq2');
            const modeRadios = document.querySelectorAll('input[name="mode"]');
            const searchBtn = document.getElementById('searchBtn');
            const errorMsg = document.getElementById('errorMsg');
            const placeholder = document.getElementById('placeholder');
            const resultContent = document.getElementById('resultContent');

            // ---------- 辅助函数 ----------
            function cleanSeq(str) {
                return str.toUpperCase().replace(/[^ATCG]/g, '');
            }

            function reverseSeq(str) {
                return str.split('').reverse().join('');
            }

            function isComplement(a, b) {
                const map = { 'A': 'T', 'T': 'A', 'C': 'G', 'G': 'C' };
                return map[a] === b;
            }

            function isSame(a, b) {
                return a === b;
            }

            // ---------- 核心算法 ----------
            function findCommonSubstrings(s1, s2, mode) {
                // s1, s2 已是大写 ATCG
                const n = s1.length;
                const m = s2.length;
                if (n === 0 || m === 0) return { mark1: [], mark2: [], lcs: '', lcsLen: 0, subCount: 0 };

                const matchFn = (mode === 'complement') ? isComplement : isSame;

                // DP: dp[i][j] = 以 s1[i-1], s2[j-1] 结尾的最长公共子串长度
                const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

                // 记录所有匹配的位置对 (i, j) 且长度 >= 2
                // 用区间合并的方式标记
                // 先收集所有 "匹配段" 的区间
                const segments1 = []; // 每个元素 { start, end } 在 s1 中的区间 [start, end)
                const segments2 = [];

                // 为了去重，我们按长度从大到小处理，但这里直接用标记数组
                // 标记数组
                const mark1 = Array(n).fill(false);
                const mark2 = Array(m).fill(false);

                // 记录最长公共子串信息
                let maxLen = 0;
                let maxEnd1 = -1; // 在 s1 中的结束位置 (exclusive)

                // 填充 DP
                for (let i = 1; i <= n; i++) {
                    for (let j = 1; j <= m; j++) {
                        if (matchFn(s1[i - 1], s2[j - 1])) {
                            dp[i][j] = dp[i - 1][j - 1] + 1;
                            if (dp[i][j] >= 2) {
                                // 标记这个子串
                                const len = dp[i][j];
                                const start1 = i - len;
                                const end1 = i;
                                const start2 = j - len;
                                const end2 = j;
                                // 标记区间
                                for (let k = start1; k < end1; k++) mark1[k] = true;
                                for (let k = start2; k < end2; k++) mark2[k] = true;
                                // 更新最长
                                if (len > maxLen) {
                                    maxLen = len;
                                    maxEnd1 = i;
                                }
                            }
                        } else {
                            dp[i][j] = 0;
                        }
                    }
                }

                // 提取最长公共子串
                let lcs = '';
                if (maxLen > 0 && maxEnd1 > 0) {
                    lcs = s1.substring(maxEnd1 - maxLen, maxEnd1);
                }

                // 统计公共子串数量 (长度 >= 2 的不同子串)
                // 使用 Set 去重
                const subSet = new Set();
                for (let i = 1; i <= n; i++) {
                    for (let j = 1; j <= m; j++) {
                        if (dp[i][j] >= 2) {
                            const len = dp[i][j];
                            const sub = s1.substring(i - len, i);
                            subSet.add(sub + '|' + len); // 用子串+长度去重
                        }
                    }
                }
                // 但上面去重可能不准确，因为相同子串可能在不同位置，但这里我们只关心不同内容
                // 更好的去重：只根据子串内容
                const contentSet = new Set();
                for (let i = 1; i <= n; i++) {
                    for (let j = 1; j <= m; j++) {
                        if (dp[i][j] >= 2) {
                            const len = dp[i][j];
                            const sub = s1.substring(i - len, i);
                            contentSet.add(sub);
                        }
                    }
                }

                return {
                    mark1,
                    mark2,
                    lcs,
                    lcsLen: maxLen,
                    subCount: contentSet.size,
                    dp,
                    s1,
                    s2
                };
            }

            // ---------- 渲染 ----------
            function renderResult(s1, s2, mark1, mark2, lcs, lcsLen, subCount, mode) {
                const modeLabel = mode === 'complement' ? '互补配对' : '完全相同';

                // 构建字符显示
                function buildChars(str, marks, colorClass) {
                    const chars = str.split('');
                    return chars.map((ch, idx) => {
                        const isMarked = marks[idx] || false;
                        let cls = 'char';
                        if (isMarked) {
                            cls += ' ' + colorClass;
                        }
                        return `<span class="${cls}">${ch}</span>`;
                    }).join('');
                }

                // 统计标记数量
                const count1 = mark1.filter(Boolean).length;
                const count2 = mark2.filter(Boolean).length;

                // 反转后的序列1 (原始s1已经反转过了)
                const s1Reversed = s1;

                const html = `
                    <div class="seq-display">
                        <div class="seq-label">
                            <span class="dot red"></span> 序列 1 <span style="font-weight:400;color:#4a6a7f;">(反转后)</span>
                            <span class="tag">红色标记 ${count1} 个碱基</span>
                        </div>
                        <div class="seq-chars">${buildChars(s1Reversed, mark1, 'mark-red')}</div>
                    </div>

                    <div class="seq-display">
                        <div class="seq-label">
                            <span class="dot blue"></span> 序列 2
                            <span class="tag">蓝色标记 ${count2} 个碱基</span>
                        </div>
                        <div class="seq-chars">${buildChars(s2, mark2, 'mark-blue')}</div>
                    </div>

                    <div class="stats">
                        <div class="stat-item">
                            <span>🔴 序列1 标记</span>
                            <span class="num red">${count1}</span>
                            <span style="color:#7a96ae;">/ ${s1Reversed.length}</span>
                        </div>
                        <div class="stat-item">
                            <span>🔵 序列2 标记</span>
                            <span class="num blue">${count2}</span>
                            <span style="color:#7a96ae;">/ ${s2.length}</span>
                        </div>
                        <div class="stat-item">
                            <span>📦 公共子串数量 (长度≥2)</span>
                            <span class="num">${subCount}</span>
                        </div>
                        <div class="stat-item">
                            <span>📐 匹配模式</span>
                            <span style="font-weight:600;color:#0b2b3f;">${modeLabel}</span>
                        </div>
                    </div>

                    <div class="lcs-info">
                        <span class="lcs-label">🏆 最长公共子串</span>
                        ${lcsLen > 0 ? `
                            <span class="lcs-seq">${lcs}</span>
                            <span class="lcs-len">长度 ${lcsLen}</span>
                        ` : `
                            <span style="color:#8aacbf;">未找到长度 ≥ 2 的公共子串</span>
                        `}
                        <span class="lcs-count">共 ${subCount} 个不同的公共子串</span>
                    </div>
                `;

                return html;
            }

            // ---------- 主流程 ----------
            function runSearch() {
                // 隐藏错误
                errorMsg.classList.remove('show');
                errorMsg.textContent = '';

                // 获取输入
                let raw1 = seq1Input.value;
                let raw2 = seq2Input.value;

                // 清洗
                const s1Clean = cleanSeq(raw1);
                const s2Clean = cleanSeq(raw2);

                if (!s1Clean || !s2Clean) {
                    errorMsg.textContent = '⚠️ 请在两栏中都输入有效的 ATCG 序列（只包含 A, T, C, G）';
                    errorMsg.classList.add('show');
                    return;
                }

                // 反转第一条
                const s1Rev = reverseSeq(s1Clean);
                const s2 = s2Clean;

                // 获取模式
                let mode = 'same';
                for (const radio of modeRadios) {
                    if (radio.checked) {
                        mode = radio.value;
                        break;
                    }
                }

                // 执行算法
                const result = findCommonSubstrings(s1Rev, s2, mode);

                // 渲染
                const html = renderResult(
                    s1Rev,
                    s2,
                    result.mark1,
                    result.mark2,
                    result.lcs,
                    result.lcsLen,
                    result.subCount,
                    mode
                );

                // 显示结果
                placeholder.style.display = 'none';
                resultContent.style.display = 'block';
                resultContent.innerHTML = html;

                // 如果没有任何标记，显示提示
                const totalMarked = result.mark1.filter(Boolean).length + result.mark2.filter(Boolean).length;
                if (totalMarked === 0) {
                    // 在结果上方追加一条提示
                    const notice = document.createElement('div');
                    notice.style.cssText = `
                        background: #fef9e7;
                        border: 1px solid #f5d98e;
                        border-radius: 12px;
                        padding: 12px 18px;
                        margin-bottom: 16px;
                        color: #7a6a2a;
                        font-size: 14px;
                        display: flex;
                        align-items: center;
                        gap: 10px;
                    `;
                    notice.innerHTML = `ℹ️ 未找到长度 ≥ 2 的公共子串（${mode === 'complement' ? '互补配对' : '完全相同'}模式）`;
                    resultContent.prepend(notice);
                }
            }

            // ---------- 事件绑定 ----------
            searchBtn.addEventListener('click', runSearch);

            // 回车触发
            seq1Input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
            seq2Input.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });

            // 自动去除非法字符（实时清洗提示）
            function autoCleanInput(input) {
                const cleaned = cleanSeq(input.value);
                if (cleaned !== input.value.toUpperCase().replace(/[^ATCG]/g, '')) {
                    // 只做视觉提示，不强制修改
                }
            }
            seq1Input.addEventListener('input', () => autoCleanInput(seq1Input));
            seq2Input.addEventListener('input', () => autoCleanInput(seq2Input));

            // ---------- 初始加载自动执行（用默认值演示） ----------
            window.addEventListener('DOMContentLoaded', () => {
                // 延迟一点点执行，确保渲染完成
                setTimeout(runSearch, 200);
            });

        })();
    </script>

</body>
</html>
