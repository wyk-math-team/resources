<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Molecular 3D viewer — CCl₃F · XeF₄ · Benzene</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0}
  #scene canvas{display:block}

  #panel{
    position:fixed;top:14px;left:14px;width:288px;
    max-height:calc(100vh - 28px);overflow:auto;
    background:rgba(22,27,34,.93);border:1px solid var(--border);
    border-radius:10px;padding:14px;font-size:13px;line-height:1.45;
    backdrop-filter:blur(4px);
  }
  #panel h1{font-size:14px;margin:0 0 2px;letter-spacing:.2px}
  #panel .sub{color:var(--muted);font-size:11.5px;margin-bottom:14px}

  .group{margin-bottom:14px}
  .group h2{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin:0 0 7px;font-weight:600;
  }
  button{
    display:block;width:100%;text-align:left;margin:0 0 6px;padding:7px 10px;
    background:#21262d;color:var(--fg);border:1px solid var(--border);
    border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit;
    transition:background .12s,border-color .12s,color .12s;
  }
  button:hover{background:#2b323b}
  button[aria-pressed="true"]{
    background:#1f3b5c;border-color:var(--accent);color:#cfe4ff;
  }
  button[aria-pressed="true"]::after{content:" ✓";color:var(--accent)}
  button:disabled{opacity:.35;cursor:not-allowed}

  .row{display:flex;gap:6px}
  .row button{margin-bottom:6px}

  #legend{font-size:11.5px;color:var(--muted);line-height:1.6}
  #legend div{margin-bottom:2px}
  .swatch{
    display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;
    vertical-align:middle;border:1px solid rgba(255,255,255,.22);
  }

  #note{
    position:fixed;top:14px;right:14px;width:262px;
    background:rgba(22,27,34,.93);border:1px solid var(--border);
    border-radius:10px;padding:13px 15px;font-size:12px;line-height:1.55;
    color:var(--muted);
  }
  #note b{color:var(--fg);font-weight:600}
  #note .k{color:#cfe4ff}

  #hint{
    position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:11.5px;color:var(--muted);background:rgba(22,27,34,.85);
    border:1px solid var(--border);border-radius:20px;padding:5px 15px;white-space:nowrap;
  }

  @media (max-width:820px){
    #note{display:none}
    #panel{width:236px;padding:12px}
    #hint{font-size:10.5px;padding:4px 12px}
  }
</style>
</head>
<body>

<div id="scene"></div>

<div id="panel">
  <h1 id="mol-title">Trichlorofluoromethane</h1>
  <div class="sub" id="mol-sub">CCl₃F · CFC‑11 · sp³ tetrahedral</div>

  <div class="group">
    <h2>Molecule</h2>
    <button id="mol-ccl3f"   aria-pressed="true">CCl₃F · CFC‑11</button>
    <button id="mol-xef4"    aria-pressed="false">XeF₄ · Xenon tetrafluoride</button>
    <button id="mol-benzene" aria-pressed="false">C₆H₆ · Benzene</button>
  </div>

  <div class="group">
    <h2>Overlays</h2>
    <button id="btn-cloud">Electron cloud &amp; bonding</button>
    <button id="btn-lone">Lone pair electrons</button>
    <button id="btn-bond">Bond polarity vectors</button>
    <button id="btn-net">Net molecular dipole</button>
  </div>

  <div class="group">
    <h2>Camera</h2>
    <div class="row">
      <button id="cam-persp">Perspective</button>
      <button id="cam-ortho">Orthographic</button>
    </div>
    <div class="row">
      <button id="view-front">Front</button>
      <button id="view-top">Top</button>
      <button id="view-reset">Reset</button>
    </div>
  </div>

  <div class="group" id="legend">
    <h2>Legend</h2>
    <div><span class="swatch" style="background:#ff9f45"></span>Bond dipole (δ⁺ → δ⁻)</div>
    <div><span class="swatch" style="background:#e05cff"></span>Net molecular dipole</div>
    <div><span class="swatch" style="background:#ffd54f"></span>Lone pair (2 e⁻)</div>
    <div><span class="swatch" style="background:#4fc3f7"></span>σ bonding / π cloud</div>
  </div>
</div>

<div id="note"></div>

<div id="hint">Drag to rotate · scroll to zoom · right‑drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   0.  SHARED CONSTANTS
   ========================================================= */
const CLOUD_COLOR    = 0x4fc3f7;
const LONE_COLOR     = 0xffd54f;
const BOND_DIP_COLOR = 0xff9f45;
const NET_COLOR      = 0xe05cff;

const R_ATOM = { C: 0.32, Cl: 0.55, F: 0.40, Xe: 0.58, H: 0.20 };
const C_ATOM = { C: 0x5b6470, Cl: 0x36c25c, F: 0xa8e05f, Xe: 0x429eb0, H: 0xf0f0f0 };

const BOND_MAT = new THREE.MeshStandardMaterial({
  color: 0x7d8590, roughness: 0.55, metalness: 0.1
});
const LONE_MAT = new THREE.MeshStandardMaterial({
  color: LONE_COLOR, emissive: 0xffb300, emissiveIntensity: 0.55,
  roughness: 0.4, metalness: 0.0
});

/* =========================================================
   1.  RENDERER / SCENE / LIGHTS
   ========================================================= */
const container = document.getElementById('scene');
const renderer  = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(4, 8, 6); scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x9dc4ff, 1.3);
fillLight.position.set(-6, -2, -5); scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
rimLight.position.set(0, -6, 4); scene.add(rimLight);

/* =========================================================
   2.  CAMERAS
   ========================================================= */
const DEFAULT_POS = new THREE.Vector3(3.2, 2.6, 4.8);
const FRUSTUM     = 3.2;

let aspect = window.innerWidth / window.innerHeight;

const perspCam = new THREE.PerspectiveCamera(42, aspect, 0.1, 500);
perspCam.position.copy(DEFAULT_POS);

const orthoCam = new THREE.OrthographicCamera(
  -FRUSTUM * aspect, FRUSTUM * aspect, FRUSTUM, -FRUSTUM, 0.1, 500
);
orthoCam.position.copy(DEFAULT_POS);

let camera = perspCam;
let controls = makeControls();

function makeControls() {
  const c = new OrbitControls(camera, renderer.domElement);
  c.enableDamping = true;
  c.dampingFactor = 0.08;
  c.minDistance   = 2.5;
  c.maxDistance   = 30;
  c.target.set(0, 0, 0);
  c.update();
  return c;
}

function setCamera(type) {
  const pos    = camera.position.clone();
  const target = controls.target.clone();

  camera = (type === 'ortho') ? orthoCam : perspCam;
  camera.position.copy(pos);
  camera.up.set(0, 1, 0);

  controls.dispose();
  controls = makeControls();
  controls.target.copy(target);
  controls.update();

  document.getElementById('cam-persp').setAttribute('aria-pressed', String(type === 'persp'));
  document.getElementById('cam-ortho').setAttribute('aria-pressed', String(type === 'ortho'));
}

/* =========================================================
   3.  LOW-LEVEL HELPERS
   ========================================================= */
function addAtom(parent, pos, radius, color) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 40, 28),
    new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.15 })
  );
  mesh.position.copy(pos);
  parent.add(mesh);
  return mesh;
}

function addBond(parent, a, b, radius = 0.085) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, len, 18),
    BOND_MAT
  );
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  parent.add(mesh);
  return mesh;
}

function makeArrow(origin, dir, length, color, opts = {}) {
  const {
    shaftRadius = 0.032,
    headLength  = 0.28,
    headRadius  = 0.085,
    onTop       = false
  } = opts;

  const g = new THREE.Group();
  const d = dir.clone().normalize();
  const shaftLen = Math.max(0.001, length - headLength);

  const mat = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.45,
    roughness: 0.35,
    metalness: 0.0,
    depthTest:  !onTop,
    depthWrite: !onTop
  });

  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLen, 14), mat
  );
  shaft.position.y = shaftLen / 2;

  const head = new THREE.Mesh(
    new THREE.ConeGeometry(headRadius, headLength, 20), mat
  );
  head.position.y = shaftLen + headLength / 2;

  g.add(shaft, head);
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
  g.position.copy(origin);
  if (onTop) g.renderOrder = 20;

  return g;
}

function makeLabel(text, color = '#e6edf3', scale = 0.55) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 46px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 34);

  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 4;

  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false
  }));
  sprite.scale.set(scale, scale * 0.5, 1);
  sprite.renderOrder = 30;
  return sprite;
}

function addSigmaLobe(parent, a, b, radius = 0.33) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, 28, 20),
    new THREE.MeshStandardMaterial({
      color: CLOUD_COLOR,
      emissive: CLOUD_COLOR,
      emissiveIntensity: 0.35,
      transparent: true,
      opacity: 0.17,
      depthWrite: false,
      roughness: 0.6,
      side: THREE.DoubleSide
    })
  );
  mesh.scale.set(radius, len / 2, radius);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.renderOrder = 2;
  parent.add(mesh);
}

/* Three lone-pair directions around a halogen: 109.47° away from the
   given bond direction, 120° apart from each other. */
function lonePairDirections(bondDir) {
  const u = bondDir.clone().normalize();
  const ref = Math.abs(u.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const a = new THREE.Vector3().crossVectors(u, ref).normalize();
  const b = new THREE.Vector3().crossVectors(u, a).normalize();
  const SQ = 2 * Math.SQRT2 / 3;

  return [0, 1, 2].map(k => {
    const t = k * 2 * Math.PI / 3;
    return u.clone().multiplyScalar(-1/3)
      .addScaledVector(a, SQ * Math.cos(t))
      .addScaledVector(b, SQ * Math.sin(t))
      .normalize();
  });
}

function addHalogenLonePairs(parent, center, bondDir, dist) {
  for (const d of lonePairDirections(bondDir)) {
    const c = center.clone().addScaledVector(d, dist);
    const ref = Math.abs(d.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    const sep = new THREE.Vector3().crossVectors(d, ref).normalize().multiplyScalar(0.105);

    for (const s of [1, -1]) {
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.072, 14, 10), LONE_MAT);
      dot.position.copy(c).addScaledVector(sep, s);
      parent.add(dot);
    }
  }
}

/* Two dots forming one axial lone pair (used for XeF4). */
function addAxialLonePair(parent, center, axisDir, dist, separation = 0.11) {
  const c = center.clone().addScaledVector(axisDir, dist);
  const ref = Math.abs(axisDir.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const sep = new THREE.Vector3().crossVectors(axisDir, ref).normalize().multiplyScalar(separation);

  for (const s of [1, -1]) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 14, 10), LONE_MAT);
    dot.position.copy(c).addScaledVector(sep, s);
    parent.add(dot);
  }
}

/* =========================================================
   4.  MOLECULE BUILDERS
   ========================================================= */

/* ---------- 4a. CCl₃F (tetrahedral) ---------- */
function buildCCl3F() {
  const root  = new THREE.Group();
  const cloud = new THREE.Group();
  const lone  = new THREE.Group();
  const bond  = new THREE.Group();
  const net   = new THREE.Group();
  root.add(cloud, lone, bond, net);

  const L_CF  = 1.39;
  const L_CCl = 1.76;
  const EN    = { C: 2.55, Cl: 3.16, F: 3.98 };

  const SQ   = 2 * Math.SQRT2 / 3;
  const dirF = new THREE.Vector3(0, 1, 0);
  const dirCl = [0, 1, 2].map(i => {
    const t = i * 2 * Math.PI / 3;
    return new THREE.Vector3(SQ * Math.cos(t), -1/3, SQ * Math.sin(t));
  });

  const posC  = new THREE.Vector3(0, 0, 0);
  const posF  = dirF.clone().multiplyScalar(L_CF);
  const posCl = dirCl.map(d => d.clone().multiplyScalar(L_CCl));

  const muCF  = (EN.F  - EN.C) * L_CF;
  const muCCl = (EN.Cl - EN.C) * L_CCl;

  const netMu = new THREE.Vector3();
  netMu.addScaledVector(dirF, muCF);
  dirCl.forEach(d => netMu.addScaledVector(d, muCCl));

  // Atoms + bonds
  addAtom(root, posC, R_ATOM.C,  C_ATOM.C);
  addAtom(root, posF, R_ATOM.F,  C_ATOM.F);
  posCl.forEach(p => addAtom(root, p, R_ATOM.Cl, C_ATOM.Cl));

  addBond(root, posC, posF);
  posCl.forEach(p => addBond(root, posC, p));

  // σ lobes
  addSigmaLobe(cloud, posC, posF);
  posCl.forEach(p => addSigmaLobe(cloud, posC, p));

  // Tetrahedral outline
  const TET_R = 2.05;
  const tetVerts = [
    dirF.clone().multiplyScalar(TET_R),
    ...dirCl.map(d => d.clone().multiplyScalar(TET_R))
  ];
  const faceIdx = [[0,1,2],[0,2,3],[0,3,1],[1,3,2]];
  const facePos = [];
  for (const f of faceIdx) for (const i of f)
    facePos.push(tetVerts[i].x, tetVerts[i].y, tetVerts[i].z);
  const tetGeo = new THREE.BufferGeometry();
  tetGeo.setAttribute('position', new THREE.Float32BufferAttribute(facePos, 3));
  tetGeo.computeVertexNormals();
  const tetFaces = new THREE.Mesh(tetGeo, new THREE.MeshBasicMaterial({
    color: CLOUD_COLOR, transparent: true, opacity: 0.055,
    side: THREE.DoubleSide, depthWrite: false
  }));
  tetFaces.renderOrder = 1;
  cloud.add(tetFaces);

  const edgePairs = [[0,1],[0,2],[0,3],[1,2],[2,3],[3,1]];
  const edgePos = [];
  for (const [i, j] of edgePairs) {
    edgePos.push(tetVerts[i].x, tetVerts[i].y, tetVerts[i].z);
    edgePos.push(tetVerts[j].x, tetVerts[j].y, tetVerts[j].z);
  }
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
  const tetEdges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color: CLOUD_COLOR, transparent: true, opacity: 0.35, depthWrite: false
  }));
  tetEdges.renderOrder = 2;
  cloud.add(tetEdges);

  // Lone pairs
  addHalogenLonePairs(lone, posF, dirF, 0.62);
  posCl.forEach((p, i) => addHalogenLonePairs(lone, p, dirCl[i], 0.80));

  // Bond dipoles + δ labels
  const DIP_SCALE = 0.62;
  bond.add(makeArrow(posC, dirF, muCF * DIP_SCALE, BOND_DIP_COLOR, {
    shaftRadius: 0.030, headLength: 0.24, headRadius: 0.080
  }));
  posCl.forEach((_, i) => {
    bond.add(makeArrow(posC, dirCl[i], muCCl * DIP_SCALE, BOND_DIP_COLOR, {
      shaftRadius: 0.026, headLength: 0.20, headRadius: 0.068
    }));
  });

  const dPlus = makeLabel('δ+', '#8fd3ff', 0.52);
  dPlus.position.copy(posC).add(new THREE.Vector3(0, 0.02, 0.42));
  bond.add(dPlus);

  const dMinusF = makeLabel('δ−', '#ffb37a', 0.52);
  dMinusF.position.copy(posF).addScaledVector(dirF, 0.62);
  bond.add(dMinusF);

  posCl.forEach((p, i) => {
    const lbl = makeLabel('δ−', '#ffb37a', 0.52);
    lbl.position.copy(p).addScaledVector(dirCl[i], 0.90);
    bond.add(lbl);
  });

  // Net dipole
  const NET_SCALE = 1.85;
  const netLen = netMu.length() * NET_SCALE;
  net.add(makeArrow(posC, netMu, netLen, NET_COLOR, {
    shaftRadius: 0.042, headLength: 0.34, headRadius: 0.115, onTop: true
  }));
  const netLabel = makeLabel('net μ', '#f0b6ff', 0.72);
  netLabel.position.copy(posC).addScaledVector(netMu.clone().normalize(), netLen + 0.32);
  net.add(netLabel);

  return { root, cloud, lone, bond, net };
}

/* ---------- 4b. XeF₄ (square planar, AX₄E₂) ---------- */
function buildXeF4() {
  const root  = new THREE.Group();
  const cloud = new THREE.Group();
  const lone  = new THREE.Group();
  const bond  = new THREE.Group();
  const net   = new THREE.Group();
  root.add(cloud, lone, bond, net);

  const L_XeF = 1.95;
  const EN    = { Xe: 2.60, F: 3.98 };

  const posXe = new THREE.Vector3(0, 0, 0);
  const dirF  = [
    new THREE.Vector3( 1, 0,  0),
    new THREE.Vector3(-1, 0,  0),
    new THREE.Vector3( 0, 0,  1),
    new THREE.Vector3( 0, 0, -1)
  ];
  const posF = dirF.map(d => d.clone().multiplyScalar(L_XeF));

  const muXeF = (EN.F - EN.Xe) * L_XeF;   // ≈ 2.69

  // Atoms + bonds
  addAtom(root, posXe, R_ATOM.Xe, C_ATOM.Xe);
  posF.forEach(p => addAtom(root, p, R_ATOM.F, C_ATOM.F));
  posF.forEach(p => addBond(root, posXe, p));

  // σ lobes
  posF.forEach(p => addSigmaLobe(cloud, posXe, p, 0.40));

  // Square-planar equatorial plane (translucent disc)
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(2.7, 64),
    new THREE.MeshBasicMaterial({
      color: CLOUD_COLOR, transparent: true, opacity: 0.05,
      side: THREE.DoubleSide, depthWrite: false
    })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.renderOrder = 1;
  cloud.add(disc);

  // Axial lone-pair electron clouds (two flattened ellipsoids)
  for (const sign of [1, -1]) {
    const ell = new THREE.Mesh(
      new THREE.SphereGeometry(1, 24, 18),
      new THREE.MeshStandardMaterial({
        color: LONE_COLOR,
        emissive: LONE_COLOR,
        emissiveIntensity: 0.25,
        transparent: true,
        opacity: 0.14,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    ell.scale.set(0.42, 0.55, 0.42);
    ell.position.set(0, sign * 0.80, 0);
    ell.renderOrder = 2;
    cloud.add(ell);
  }

  // Lone pairs (2 axial lone pairs on Xe, 3 on each F)
  const up   = new THREE.Vector3(0, 1, 0);
  const down = new THREE.Vector3(0, -1, 0);
  addAxialLonePair(lone, posXe, up,   0.78);
  addAxialLonePair(lone, posXe, down, 0.78);
  posF.forEach((p, i) => addHalogenLonePairs(lone, p, dirF[i], 0.72));

  // Bond dipoles (visible so students see they cancel)
  const DIP_SCALE = 0.45;
  posF.forEach((_, i) => {
    bond.add(makeArrow(posXe, dirF[i], muXeF * DIP_SCALE, BOND_DIP_COLOR, {
      shaftRadius: 0.030, headLength: 0.22, headRadius: 0.075
    }));
  });

  // δ labels
  const dPlus = makeLabel('δ+', '#8fd3ff', 0.55);
  dPlus.position.set(0, 0.42, 0);
  bond.add(dPlus);

  posF.forEach((p, i) => {
    const lbl = makeLabel('δ−', '#ffb37a', 0.55);
    lbl.position.copy(p).addScaledVector(dirF[i], 0.62);
    bond.add(lbl);
  });

  // Net dipole = 0 → show a small "net μ = 0" label
  const zeroLbl = makeLabel('net μ = 0', '#f0b6ff', 0.85);
  zeroLbl.position.set(0, -2.6, 0);
  net.add(zeroLbl);

  // Dashed reference axes in the equatorial plane (visual aid)
  const axesMat = new THREE.LineBasicMaterial({
    color: CLOUD_COLOR, transparent: true, opacity: 0.35, depthWrite: false
  });
  for (const [a, b] of [[posF[0], posF[1]], [posF[2], posF[3]]]) {
    const g = new THREE.BufferGeometry().setFromPoints([
      a.clone().multiplyScalar(1.25), b.clone().multiplyScalar(1.25)
    ]);
    const ln = new THREE.Line(g, axesMat);
    ln.renderOrder = 1;
    cloud.add(ln);
  }

  return { root, cloud, lone, bond, net };
}

/* ---------- 4c. Benzene (C₆H₆, aromatic) ---------- */
function buildBenzene() {
  const root  = new THREE.Group();
  const cloud = new THREE.Group();
  const lone  = new THREE.Group();   // none
  const bond  = new THREE.Group();
  const net   = new THREE.Group();   // symmetric → zero
  root.add(cloud, lone, bond, net);

  const R_CC = 1.40;       // hexagon "radius" = C–C distance
  const L_CH = 1.09;

  // Ring lies in the XZ plane
  const carbons = [];
  for (let i = 0; i < 6; i++) {
    const t = i * Math.PI / 3;
    carbons.push(new THREE.Vector3(R_CC * Math.cos(t), 0, R_CC * Math.sin(t)));
  }
  const hydrogens = carbons.map(c => {
    const dir = c.clone().normalize();
    return c.clone().addScaledVector(dir, L_CH);
  });

  // Atoms
  carbons.forEach(c => addAtom(root, c, R_ATOM.C, C_ATOM.C));
  hydrogens.forEach(h => addAtom(root, h, R_ATOM.H, C_ATOM.H));

  // σ bonds (ring + C–H)
  for (let i = 0; i < 6; i++) addBond(root, carbons[i], carbons[(i + 1) % 6], 0.080);
  carbons.forEach((c, i) => addBond(root, c, hydrogens[i], 0.060));

  // σ lobes (subtle)
  for (let i = 0; i < 6; i++) addSigmaLobe(cloud, carbons[i], carbons[(i + 1) % 6], 0.20);
  carbons.forEach((c, i) => addSigmaLobe(cloud, c, hydrogens[i], 0.14));

  // π system — two translucent discs above/below the ring
  const piMat = new THREE.MeshStandardMaterial({
    color: CLOUD_COLOR,
    emissive: CLOUD_COLOR,
    emissiveIntensity: 0.32,
    transparent: true,
    opacity: 0.20,
    depthWrite: false,
    side: THREE.DoubleSide,
    roughness: 0.55
  });
  for (const sign of [1, -1]) {
    const disc = new THREE.Mesh(new THREE.CircleGeometry(R_CC * 1.22, 64), piMat);
    disc.rotation.x = -Math.PI / 2;
    disc.position.y = sign * 0.34;
    disc.renderOrder = 2;
    cloud.add(disc);
  }

  // π cloud rim — draw two faint circles to hint at the delocalised ring
  const ringMat = new THREE.LineBasicMaterial({
    color: CLOUD_COLOR, transparent: true, opacity: 0.55, depthWrite: false
  });
  for (const sign of [1, -1]) {
    const pts = [];
    for (let i = 0; i <= 64; i++) {
      const t = i * 2 * Math.PI / 64;
      pts.push(new THREE.Vector3(R_CC * 1.22 * Math.cos(t), sign * 0.34, R_CC * 1.22 * Math.sin(t)));
    }
    const ring = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts), ringMat
    );
    ring.renderOrder = 3;
    cloud.add(ring);
  }

  // Net dipole = 0
  const zeroLbl = makeLabel('net μ = 0', '#f0b6ff', 0.85);
  zeroLbl.position.set(0, -2.4, 0);
  net.add(zeroLbl);

  return { root, cloud, lone, bond, net };
}

/* =========================================================
   5.  MOLECULE REGISTRY
   ========================================================= */
const MOLECULES = {
  ccl3f: {
    title: 'Trichlorofluoromethane',
    sub:   'CCl₃F · CFC‑11 · sp³ tetrahedral',
    cameraPos: [3.2, 2.6, 4.8],
    note: `
      <b>Bond lengths</b><br>
      C–F <span class="k">1.39 Å</span> · C–Cl <span class="k">1.76 Å</span><br>
      <b>Bond angles</b> ≈ <span class="k">109.5°</span><br><br>
      <b>Electron cloud</b><br>
      Electron‑pair geometry: <span class="k">tetrahedral</span>.
      Molecular shape: <span class="k">tetrahedral</span>.<br>
      Four <span class="k">σ bonds</span> from sp³ hybrid orbitals on carbon;
      <span class="k">0 lone pairs</span> on C. Each Cl and the F carries
      <span class="k">3 lone pairs</span>.<br><br>
      <b>Polarity</b><br>
      C–F is far more polar than C–Cl, so the bond dipoles do not cancel —
      the molecule has a <span class="k">net dipole pointing toward fluorine</span>.`,
    build: buildCCl3F
  },

  xef4: {
    title: 'Xenon tetrafluoride',
    sub:   'XeF₄ · AX₄E₂ · square planar',
    cameraPos: [3.6, 3.4, 4.6],
    note: `
      <b>Bond length</b><br>
      Xe–F <span class="k">1.95 Å</span><br>
      <b>Bond angles</b> <span class="k">90°</span> (F–Xe–F) ·
      <span class="k">180°</span> (F–Xe–F, trans)<br><br>
      <b>Electron cloud</b><br>
      VSEPR: <span class="k">AX₄E₂</span> — four bonding pairs and
      <span class="k">two lone pairs</span> on Xe.<br>
      Electron‑pair geometry: <span class="k">octahedral</span>.
      Molecular shape: <span class="k">square planar</span>.<br>
      The two lone pairs sit <span class="k">axially</span>, mutually
      trans, minimising lone‑pair / lone‑pair repulsion.<br><br>
      <b>Polarity</b><br>
      Every Xe–F bond is polar, but the four bond dipoles lie in a plane
      at 90° to one another and cancel perfectly —
      <span class="k">net μ = 0</span>.`
    ,
    build: buildXeF4
  },

  benzene: {
    title: 'Benzene',
    sub:   'C₆H₆ · aromatic · D₆h',
    cameraPos: [3.6, 3.0, 4.6],
    note: `
      <b>Bond lengths</b><br>
      C–C <span class="k">1.40 Å</span> · C–H <span class="k">1.09 Å</span><br>
      <b>Bond angles</b> <span class="k">120°</span> (planar hexagon)<br><br>
      <b>Electron cloud</b><br>
      Every carbon is <span class="k">sp²</span> hybridised — three σ bonds
      at 120°, one unhybridised p orbital perpendicular to the ring.<br>
      The six p orbitals overlap side‑on to give a
      <span class="k">delocalised π system</span> above and below the
      plane (shown as the two pale discs).<br><br>
      <b>Polarity</b><br>
      C–H dipoles point outward and cancel by symmetry.
      The π cloud is symmetric about the plane. Hence
      <span class="k">net μ = 0</span> — benzene is non‑polar.`
    ,
    build: buildBenzene
  }
};

/* =========================================================
   6.  MOLECULE SWITCHING
   ========================================================= */
let currentName = null;
let currentData = null;
const overlayState = { cloud: true, lone: false, bond: false, net: false };

function disposeGroup(group) {
  group.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => m.dispose());
    }
    if (obj.material && obj.material.map) obj.material.map.dispose();
  });
}

function syncOverlayButtons() {
  const data = currentData;
  if (!data) return;

  const map = {
    cloud: 'btn-cloud',
    lone:  'btn-lone',
    bond:  'btn-bond',
    net:   'btn-net'
  };
  for (const key of Object.keys(map)) {
    const btn = document.getElementById(map[key]);
    const group = data[key];
    const hasContent = group && group.children.length > 0;
    btn.disabled = !hasContent;
    btn.setAttribute('aria-pressed', String(overlayState[key] && hasContent));
    if (group) group.visible = overlayState[key] && hasContent;
  }
}

function loadMolecule(name) {
  if (name === currentName) return;
  const spec = MOLECULES[name];
  if (!spec) return;

  // Tear down
  if (currentData) {
    scene.remove(currentData.root);
    disposeGroup(currentData.root);
  }

  // Build new
  currentData = spec.build();
  currentName = name;
  scene.add(currentData.root);

  // Update UI
  document.getElementById('mol-title').textContent = spec.title;
  document.getElementById('mol-sub').textContent   = spec.sub;
  document.getElementById('note').innerHTML        = spec.note;

  for (const key of ['ccl3f', 'xef4', 'benzene']) {
    document.getElementById('mol-' + key)
      .setAttribute('aria-pressed', String(key === name));
  }

  // Reset camera to a good angle for this molecule
  const [x, y, z] = spec.cameraPos;
  camera.position.set(x, y, z);
  controls.target.set(0, 0, 0);
  controls.update();

  syncOverlayButtons();
}

/* =========================================================
   7.  UI BINDINGS
   ========================================================= */
document.getElementById('mol-ccl3f').addEventListener('click',   () => loadMolecule('ccl3f'));
document.getElementById('mol-xef4').addEventListener('click',    () => loadMolecule('xef4'));
document.getElementById('mol-benzene').addEventListener('click', () => loadMolecule('benzene'));

function bindOverlay(btnId, key) {
  document.getElementById(btnId).addEventListener('click', () => {
    overlayState[key] = !overlayState[key];
    syncOverlayButtons();
  });
}
bindOverlay('btn-cloud', 'cloud');
bindOverlay('btn-lone',  'lone');
bindOverlay('btn-bond',  'bond');
bindOverlay('btn-net',   'net');

document.getElementById('cam-persp').addEventListener('click', () => setCamera('persp'));
document.getElementById('cam-ortho').addEventListener('click', () => setCamera('ortho'));
document.getElementById('cam-persp').setAttribute('aria-pressed', 'true');
document.getElementById('cam-ortho').setAttribute('aria-pressed', 'false');

function setViewDirection(dir) {
  const dist = camera.position.distanceTo(controls.target) || DEFAULT_POS.length();
  camera.position.copy(controls.target)
    .addScaledVector(dir.clone().normalize(), dist);
  controls.update();
}
document.getElementById('view-front').addEventListener('click', () => setViewDirection(new THREE.Vector3(0, 0, 1)));
document.getElementById('view-top').addEventListener('click',   () => setViewDirection(new THREE.Vector3(0.001, 1, 0)));
document.getElementById('view-reset').addEventListener('click', () => {
  const spec = MOLECULES[currentName];
  const [x, y, z] = spec.cameraPos;
  camera.position.set(x, y, z);
  controls.target.set(0, 0, 0);
  controls.update();
});

/* =========================================================
   8.  RESIZE + RENDER LOOP
   ========================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const a = w / h;

  perspCam.aspect = a;
  perspCam.updateProjectionMatrix();

  orthoCam.left   = -FRUSTUM * a;
  orthoCam.right  =  FRUSTUM * a;
  orthoCam.top    =  FRUSTUM;
  orthoCam.bottom = -FRUSTUM;
  orthoCam.updateProjectionMatrix();

  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

/* =========================================================
   9.  GO
   ========================================================= */
loadMolecule('ccl3f');
animate();
</script>
